<!doctype html>
<html lang="vi">
  <head>
    <link rel="stylesheet" href="./site.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7041a6" />
    <title>Đăng ký | Ánh Nguyệt</title>
  </head>
  <body data-page="register">
    <div class="site-shell">
      <div id="site-header"></div>
      <div id="page-content">
        <main class="auth-page">
          <section class="auth-card">
            <a href="index.html" class="auth-logo-link"><img src="" alt="Ánh Nguyệt" class="auth-logo" data-auth-logo /></a>
            <div class="auth-heading">
              <p class="auth-eyebrow">CHÀO MỪNG BẠN ĐẾN VỚI</p>
              <h1>Tạo tài khoản</h1>
              <p class="auth-description">Tạo tài khoản để bắt đầu hành trình mua sắm cùng Ánh Nguyệt.</p>
            </div>
            <p class="auth-error" id="auth-error" role="alert" hidden></p>
            <form class="auth-form" id="auth-form" novalidate>
              <div class="auth-field"><label for="full_name">Họ và tên</label><input id="full_name" name="full_name" type="text" placeholder="Nhập họ và tên" maxlength="100" autocomplete="name" required /></div>
              <div class="auth-field"><label for="email">Email</label><input id="email" name="email" type="email" placeholder="Nhập địa chỉ email" maxlength="150" autocomplete="email" required /></div>
              <div class="auth-field"><label for="phone">Số điện thoại</label><input id="phone" name="phone" type="tel" placeholder="Nhập số điện thoại (không bắt buộc)" maxlength="20" autocomplete="tel" /></div>
              <div class="auth-field"><label for="address">Địa chỉ</label><input id="address" name="address" type="text" placeholder="Nhập địa chỉ (không bắt buộc)" autocomplete="street-address" /></div>
              <div class="auth-field"><label for="password">Mật khẩu</label><div class="auth-password-wrap"><input id="password" name="password" type="password" placeholder="Nhập mật khẩu" maxlength="72" autocomplete="new-password" required /><button type="button" class="auth-password-toggle" data-password-toggle aria-label="Hiện mật khẩu" aria-pressed="false">Hiện</button></div></div>
              <div class="auth-field"><label for="confirmPassword">Xác nhận mật khẩu</label><input id="confirmPassword" name="confirmPassword" type="password" placeholder="Nhập lại mật khẩu" maxlength="72" autocomplete="new-password" required /></div>
              <button type="submit" class="auth-submit" id="auth-submit">Đăng ký</button>
            </form>
            <div class="auth-switch">Bạn đã có tài khoản? <a href="login.html">Đăng nhập</a></div>
            <a href="index.html" class="auth-back-home">← Quay về trang chủ</a>
          </section>
        </main>
      </div>
      <div id="footer-container"></div>
    </div>
    <script src="./config.js"></script><script type="module" src="./src/js/main.js"></script>
  </body>
</html>
