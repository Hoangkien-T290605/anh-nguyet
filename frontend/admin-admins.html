<!doctype html>
<html lang="vi">
  <head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><meta name="theme-color" content="#7041a6" /><link rel="stylesheet" href="./site.css" /><link rel="stylesheet" href="./admin.css" /><title>Tài khoản quản trị | Ánh Nguyệt</title></head>
  <body data-admin-page="admin-users"><div id="admin-gate" class="admin-gate" role="status">Đang xác minh quyền quản trị...</div><div id="admin-app" class="admin-app" hidden><aside id="admin-sidebar" class="admin-sidebar"></aside><div class="admin-main-column"><header id="admin-topbar" class="admin-topbar"></header><main id="admin-content" class="admin-content admin-operations-page"><section class="admin-page-heading"><span>BẢO MẬT TÀI KHOẢN</span><h1>Tài khoản quản trị</h1><p>Cập nhật hồ sơ cá nhân, đổi mật khẩu bằng OTP và xem danh sách Admin.</p></section><p data-admin-account-message class="admin-products-message" role="status" aria-live="polite">Đang tải hồ sơ...</p><div class="admin-account-grid"><section class="admin-operations-card"><h2>Hồ sơ của tôi</h2><form data-admin-profile-form hidden><label>Họ và tên<input name="full_name" maxlength="100" required /></label><label>Email<input name="email" type="email" readonly /></label><label>Số điện thoại<input name="phone" maxlength="20" /></label><button class="admin-primary-button" type="submit" data-admin-profile-save>Lưu hồ sơ</button></form></section><section class="admin-operations-card"><h2>Đổi mật khẩu</h2><form data-admin-password-request><label>Mật khẩu hiện tại<input name="current_password" type="password" autocomplete="current-password" required /></label><label>Mật khẩu mới<input name="new_password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required /></label><label>Nhập lại mật khẩu mới<input name="confirm_password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required /></label><button class="admin-primary-button" type="submit" data-password-request>Gửi mã xác nhận</button></form><form data-admin-password-verify hidden><label>Mã OTP 6 chữ số<input name="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required /></label><button class="admin-primary-button" type="submit">Xác nhận đổi mật khẩu</button></form><p data-admin-password-message role="status" aria-live="polite"></p></section></div><section class="admin-products-panel admin-admin-list"><h2>Danh sách tài khoản Admin</h2><label>Tìm kiếm<input type="search" data-admin-users-search placeholder="Tên, email hoặc số điện thoại" /></label><p data-admin-users-message role="status" aria-live="polite">Đang tải tài khoản...</p><div class="admin-products-table-wrap" data-admin-users-wrap hidden><table class="admin-products-table"><thead><tr><th>Họ tên</th><th>Email</th><th>Số điện thoại</th><th>Ngày tạo</th></tr></thead><tbody data-admin-users-rows></tbody></table></div><nav data-admin-users-pagination class="admin-products-pagination" hidden></nav></section></main></div></div><script src="./config.js"></script><script type="module" src="./src/js/admin/main.js"></script></body>
</html>
