<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#7041a6" />
    <link rel="stylesheet" href="./site.css" />
    <link rel="stylesheet" href="./admin.css" />
    <title>Đăng nhập nhân viên | Ánh Nguyệt</title>
  </head>
  <body data-admin-page="employee-login">
    <main class="admin-login-page">
      <section class="admin-login-card" aria-labelledby="admin-login-heading">
        <a class="admin-login-logo" href="index.html" aria-label="Ánh Nguyệt - Trang chủ">
          <img src="./assets/logo-anh-nguyet.png" alt="Logo Ánh Nguyệt" />
        </a>
        <p class="admin-eyebrow">KHU VỰC NHÂN VIÊN</p>
        <h1 id="admin-login-heading">Đăng nhập Nhân viên</h1>
        <p class="admin-login-description">Dành riêng cho tài khoản nhân viên được cấp quyền.</p>
        <p id="admin-login-status" class="admin-message" role="alert" aria-live="polite" hidden></p>
        <form id="admin-login-form" class="admin-login-form">
          <label for="admin-login-email">Email</label>
          <input id="admin-login-email" name="email" type="email" autocomplete="username" maxlength="150" required />
          <label for="admin-login-password">Mật khẩu</label>
          <input id="admin-login-password" name="password" type="password" autocomplete="current-password" required />
          <button id="admin-login-submit" class="admin-primary-button" type="submit">Đăng nhập</button>
        </form>
        <a class="admin-back-link" href="index.html">← Quay về cửa hàng</a>
      </section>
    </main>
    <script src="./config.js"></script>
    <script type="module" src="./src/js/admin/main.js"></script>
  </body>
</html>
